<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bus Station Ticket Counter</title>

<style>
    body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(to right, #0f2027, #203a43, #2c5364);
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }

    .station-box {
        background: #ffffff;
        padding: 30px;
        width: 350px;
        border-radius: 12px;
        box-shadow: 0px 10px 25px rgba(0,0,0,0.3);
        text-align: center;
    }

    .station-box h1 {
        margin-bottom: 20px;
        color: #2c5364;
    }

    input, select {
        width: 100%;
        padding: 10px;
        margin: 8px 0;
        border-radius: 6px;
        border: 1px solid #ccc;
        font-size: 15px;
    }

    button {
        width: 100%;
        padding: 12px;
        margin-top: 10px;
        border: none;
        border-radius: 6px;
        background: #2c5364;
        color: white;
        font-size: 16px;
        cursor: pointer;
        transition: 0.3s;
    }

    button:hover {
        background: #203a43;
        transform: scale(1.03);
    }

    .popup {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0,0,0,0.6);
        display: none;
        justify-content: center;
        align-items: center;
    }

    .popup-content {
        background: white;
        padding: 25px;
        width: 300px;
        border-radius: 10px;
        text-align: center;
        animation: fadeIn 0.4s ease-in-out;
    }

    @keyframes fadeIn {
        from {opacity: 0; transform: scale(0.8);}
        to {opacity: 1; transform: scale(1);}
    }

</style>
</head>

<body>

<div class="station-box">
    <h1>🚌 Bus Ticket Counter</h1>

    <form id="ticketForm">
        <input type="text" id="name" placeholder="Enter your name" required>
        <input type="number" id="age" placeholder="Enter your age" required>
        
        <select id="gender" required>
            <option value="">Select Gender</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
        </select>

        <button type="submit">Check Ticket</button>
    </form>
</div>

<div class="popup" id="popup">
    <div class="popup-content">
        <p id="resultMessage"></p>
        <button onclick="closePopup()">Close</button>
    </div>
</div>

<script>

document.getElementById("ticketForm").addEventListener("submit", function(e) {
    e.preventDefault();

    let name = document.getElementById("name").value;
    let age = Number(document.getElementById("age").value);
    let gender = document.getElementById("gender").value;

    let message = "";

    if (gender === "Male") {

        if (age <= 5 && age > 0) {
            message = `${name}, you are under ${age} years old. 🎉 You get a FREE ride!`;
        }
        else if (age > 5 && age <= 8) {
            message = `${name}, you are ${age} years old. You get a 50% discount!`;
        }
        else if (age >= 9 && age <= 65) {
            message = `${name}, you need to purchase a FULL ticket.`;
        }
        else if (age > 65) {
            message = `${name}, you are eligible for a 30% senior citizen discount!`;
        }
        else {
            message = "Please enter a valid age.";
        }

    } else if (gender === "Female") {

        if (age <= 5 && age > 0) {
            message = `${name}, you are under ${age} years old. 🎉 You get a FREE ride!`;
        }
        else if (age > 5 && age <= 8) {
            message = `${name}, you are ${age} years old. You get a 50% discount!`;
        }
        else if (age >= 9) {
            message = `${name}, you get a 50% special discount on your ticket!`;
        }
        else {
            message = "Please enter a valid age.";
        }

    } else {
        message = "Please select your gender.";
    }

    document.getElementById("resultMessage").innerText = message;
    document.getElementById("popup").style.display = "flex";
});

function closePopup() {
    document.getElementById("popup").style.display = "none";
}

</script>

</body>
</html>
